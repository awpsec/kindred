<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindred workflow concepts</title><link rel="stylesheet" href="../../ui/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font:14px/1.55 Inter,sans-serif;--muted:#999;--line:#303030;--surface:#171717;--chip:#262626}body.light{background:white;color:#222;--muted:#666;--line:#ddd;--surface:#f7f7f7;--chip:#eaeaea}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #9caeff;outline-offset:3px}nav{padding:14px 24px;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line)}button{border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:6px;font-size:12px}button:hover,nav button[aria-pressed=true]{background:var(--chip);color:inherit}.notice{font-size:11px;color:var(--muted);padding:12px 24px}.chat{width:min(740px,100%);padding:18px 28px 30px;margin:auto}.person{display:flex;gap:9px;align-items:center;margin:22px 0 10px;font-weight:600}.avatar{width:24px;height:22px;background:#acdf21;color:#162000;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:3px;padding-left:3px;flex-shrink:0}.purple{background:#aa65ff;color:white}.orange{background:#ff7156;color:white}.blue{background:#68a4ff;color:#14264b}.user{margin-left:auto;background:#404040;color:white;width:fit-content;max-width:90%;padding:9px 14px;border-radius:15px}.message{margin:10px 0 17px}.panel{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;margin:12px 0 18px}.head{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:9px}.muted,.meta{color:var(--muted);font-size:12px}.meta{margin:5px 0 9px}.row{display:flex;align-items:center;gap:8px;min-height:34px;flex-wrap:wrap}.row+.row{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.arrow{margin-left:auto;padding:5px}.arrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}.dependency{font-size:12px;color:var(--muted);margin:0 0 8px 32px}.actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.primary{border:1px solid #696969;background:var(--chip);color:inherit;padding:6px 12px}.file{display:flex;gap:12px;align-items:center}.fileicon{color:#81aafa;background:#223049;border-radius:7px;padding:8px;font-size:11px}.file p{margin:0}details{margin-top:9px}summary{cursor:pointer;list-style:none;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px}summary::-webkit-details-marker{display:none}summary:before{content:'';border:solid currentColor;border-width:0 1.5px 1.5px 0;width:5px;height:5px;transform:rotate(-45deg);transition:transform .16s}details[open]>summary:before{transform:rotate(45deg)}.detail{padding:10px 0 1px;color:var(--muted);font-size:12px}.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px}.diff p{padding:10px;margin:6px 0;border-radius:6px;font-size:13px}.added{background:#18382b;color:#bcebd8}.removed{background:#352426;color:#efd6d8}.light .added{background:#e0f1e8;color:#21573e}.light .removed{background:#f3e7e8;color:#754347}.slots{display:flex;gap:8px;flex-wrap:wrap}.slot{flex:1;text-align:left;border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:125px}.slot span{display:block;font-size:12px;color:var(--muted)}.slot[aria-pressed=true]{border-color:#8b9cf1;background:#899bff12;color:inherit}.field{display:block;margin:11px 0;font-size:12px}.field input,.field textarea,.field select{display:block;margin-top:5px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px}.field textarea{resize:vertical;min-height:60px}.choice{display:flex;gap:12px;flex-wrap:wrap;margin:7px 0 12px;font-size:12px}.choice label{display:flex;gap:5px;align-items:center}.receipt{display:block;font-size:12px;color:#54ba90;margin-top:10px}.receipt:empty{display:none}.favicon{width:18px;height:18px;border-radius:4px;background:#31557a;display:inline-grid;place-items:center;font-size:10px;color:white}.path{padding:8px 11px;border-left:1px solid var(--line);font-size:12px}.path div{margin-left:14px}.monitor{font-size:12px;border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dot{height:6px;width:6px;background:#54ba90;border-radius:50%}@media(max-width:520px){.chat{padding:12px 16px}.diff{grid-template-columns:1fr}.dependency{margin-left:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* Shared selection controls; setting switches retain their established toggle shape. */
:root{--choice-accent:#9aaeff;--choice-mark:#12182c;--choice-border:#777b86}:root[data-theme=light],body.light{--choice-accent:#5267bd;--choice-mark:#fff;--choice-border:#747884}
:is(.member-option,.skill-import-select,.checklist-label,.planning-archive,.workspace-dialog,.markdown-task,.workflow-choice,.choice) input[type=checkbox],input[type=radio]{appearance:none;-webkit-appearance:none;display:inline-block;position:relative;flex:0 0 18px;width:18px;height:18px;min-width:18px;min-height:18px;padding:0;margin:0;border:1.5px solid var(--choice-border);border-radius:5px;background:transparent;vertical-align:middle;cursor:pointer;transition:background 130ms,border-color 130ms,box-shadow 130ms}
input[type=radio]{border-radius:50%}
:is(.member-option,.skill-import-select,.checklist-label,.planning-archive,.workspace-dialog,.markdown-task,.workflow-choice,.choice) input[type=checkbox]::after,input[type=radio]::after{content:'';display:block;position:absolute;inset:3px;width:auto;height:auto;margin:0;border-radius:0;background:var(--choice-mark);transform:scale(0);transition:transform 130ms;clip-path:polygon(0 48%,18% 32%,41% 56%,82% 9%,100% 25%,42% 91%)}
input[type=radio]::after{inset:4px;border-radius:50%;clip-path:none}
:is(.member-option,.skill-import-select,.checklist-label,.planning-archive,.workspace-dialog,.markdown-task,.workflow-choice,.choice) input[type=checkbox]:checked,input[type=radio]:checked{border-color:var(--choice-accent);background:var(--choice-accent)}
:is(.member-option,.skill-import-select,.checklist-label,.planning-archive,.workspace-dialog,.markdown-task,.workflow-choice,.choice) input[type=checkbox]:checked::after,input[type=radio]:checked::after{transform:scale(1);background:var(--choice-mark)}
:is(.member-option,.skill-import-select,.checklist-label,.planning-archive,.workspace-dialog,.markdown-task,.workflow-choice,.choice) input[type=checkbox]:indeterminate{background:var(--choice-accent);border-color:var(--choice-accent)}
:is(.member-option,.skill-import-select,.checklist-label,.planning-archive,.workspace-dialog,.markdown-task,.workflow-choice,.choice) input[type=checkbox]:indeterminate::after{clip-path:none;inset:7px 3px;border-radius:1px;transform:none}
input:is([type=checkbox],[type=radio]):focus-visible{outline:2px solid var(--choice-accent);outline-offset:3px}input:is([type=checkbox],[type=radio]):hover:not(:disabled){box-shadow:0 0 0 3px color-mix(in srgb,var(--choice-accent) 14%,transparent)}input:is([type=checkbox],[type=radio]):disabled{opacity:.5;cursor:default}
.workflow-meeting{border:0;padding:0;margin:12px 0;display:flex;gap:8px 16px;flex-wrap:wrap;min-width:0}.workflow-meeting legend{font-size:12px;color:var(--muted);padding:0;margin-bottom:8px}.workflow-choice{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;cursor:pointer}.workflow-choice input{margin:0}.workflow-choice a{font-size:11px}
@media(prefers-reduced-motion:reduce){input:is([type=checkbox],[type=radio]),input:is([type=checkbox],[type=radio])::after{transition:none}}
@media(forced-colors:active){input:is([type=checkbox],[type=radio]){forced-color-adjust:auto;appearance:auto;-webkit-appearance:auto}input:is([type=checkbox],[type=radio])::after{display:none!important}}
</style><nav id="nav"></nav><div class="notice">Design preview · sample workspace · local demo actions only</div><main class="chat" id="chat"></main><script>
const av=(name,c='')=>`<span class="avatar ${c}" aria-label="${name}">••</span>`,arrow=name=>`<button class="arrow" aria-label="Open ${name} chat" data-result="Demo: opens ${name}’s chat"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg></button>`;
const cases={
project:['Project status','What’s holding up the Acme handoff?','Two things remain: the assessment results and the invoice. I’m waiting on both before closing out the handoff.',`<section class="panel"><div class="head"><strong>Acme · handoff</strong><span class="muted">2 dependencies</span></div><div class="row">${av('Paul')}<strong>Paul</strong><span class="muted">waiting on</span>${av('Rowan','purple')}<strong>Rowan</strong>${arrow('Rowan')}</div><p class="dependency">Finish assessment → deliver results</p><div class="row">${av('Paul')}<strong>Paul</strong><span class="muted">waiting on</span>${av('Avery','orange')}<strong>Avery</strong>${arrow('Avery')}</div><p class="dependency">Confirm invoice delivery</p><details><summary>Avery is waiting on Quinn</summary><div class="row">${av('Avery','orange')}<strong>Avery</strong><span class="muted">waiting on</span>${av('Quinn','blue')}<strong>Quinn</strong>${arrow('Quinn')}</div><p class="dependency">Send the approved invoice to the client</p></details><output class="receipt"></output></section><p class="message">Rowan can keep working while Quinn handles the invoice. Neither branch blocks the other.</p>`],
review:['Review & approve','Prepare the report for my review.','The report is ready. I’ve addressed the findings you flagged and kept the executive summary short.',`<section class="panel"><div class="head"><strong>Ready for your review</strong><span class="muted">Revision 3</span></div><div class="file"><span class="fileicon">DOCX</span><div><p><strong>Acme assessment.docx</strong></p><span class="muted">18 pages · 246 KB</span></div><button data-result="Demo: opens the existing document preview">Preview</button></div><details><summary>2 changes since your last review</summary><div class="detail">Clarified the impact of finding 4.<br>Added the requested retest evidence.</div></details><div class="actions"><button class="primary" data-result="Demo: revision 3 approved for review; nothing sent">Approve revision 3</button><button data-feedback>Request changes</button></div><output class="receipt"></output><p class="meta">Approves this revision. Sending to the client is a separate step.</p></section>`],
changes:['Changes','Give clients three days before following up.','Here’s the one-line change.',`<section class="panel"><div class="head"><strong>Client follow-up rule</strong><span class="muted">1 change</span></div><div class="diff"><div><span class="muted">Current</span><p class="removed">Follow up after <del>one business day</del>.</p></div><div><span class="muted">Proposed</span><p class="added">Follow up after <ins>three business days</ins>.</p></div></div><details><summary>Read the full instructions</summary><div class="detail">Use the client’s business timezone. Follow up after three business days. Skip weekends and known holidays. Escalate urgent requests immediately.</div></details><div class="actions"><button class="primary" data-result="Demo: accepts this exact instruction revision">Allow this change</button><button data-result="Demo: change declined">Keep current</button></div><output class="receipt"></output></section>`],
schedule:['Scheduling','Find half an hour with Jordan next week.','These slots are free on both calendars. Tuesday gives you some breathing room before your next meeting.',`<section class="panel"><div class="head"><strong>Acme review · 30 min</strong><span class="muted">America/New_York</span></div><p class="meta">You + Jordan · Work calendar · Google Calendar</p><div class="slots"><button class="slot" aria-pressed="true"><span>Tue, Sep 22</span><strong>10:00–10:30 AM</strong></button><button class="slot" aria-pressed="false"><span>Wed, Sep 23</span><strong>2:00–2:30 PM</strong></button><button class="slot" aria-pressed="false"><span>Thu, Sep 24</span><strong>11:00–11:30 AM</strong></button></div><details><summary>Attendees & calendar details</summary><div class="detail">You: Alex@example.invalid<br>Jordan: jordan@example.invalid<br>Availability rechecked before sending.</div></details><div class="actions"><button class="primary" data-result="Demo: prepares selected slot for invitation review; no invite sent">Review invitation</button><button data-result="Demo: asks the bot for other times">Other times</button></div><output class="receipt"></output></section>`],
decision:['Decision form','Put together the Acme report.','I have the findings. Two choices will help me tailor the report.',`<form class="panel"><div class="head"><strong>Report preferences</strong></div><label class="field">Audience<select name="audience"><option>Client leadership</option><option>Technical team</option><option>Both</option></select></label><div class="field">Include</div><div class="choice"><label><input type="checkbox" checked> Evidence appendix</label><label><input type="checkbox" checked> Retest plan</label></div><label class="field">Anything to emphasize? <span class="muted">Optional</span><textarea placeholder="e.g. Make remediation priorities clear"></textarea></label><button class="primary" type="submit">Use these answers</button><output class="receipt"></output></form>`],
handoff:['Decision · handoff','Prepare this report for the client.','Before I finish, which version do you want?',`<form class="panel"><div class="head"><strong>Report handoff</strong></div><div class="choice"><label><input type="radio" name="version" checked> Executive summary</label><label><input type="radio" name="version"> Full technical report</label></div><div class="choice"><label><input type="checkbox" checked> Include evidence appendix</label></div><button class="primary" type="submit">Use these choices</button><output class="receipt"></output></form>`],
meeting:['Decision · meeting','Set up the Acme kickoff.','I can handle it. Which calendar and format should I use?',`<form class="panel"><div class="head"><strong>Kickoff preferences</strong></div><label class="field">Calendar<select><option>Work · Alex@example.invalid</option><option>Personal · Alex@example.invalid</option></select></label><div class="choice"><label><input type="radio" name="format" checked> Video call</label><label><input type="radio" name="format"> In person</label></div><button class="primary" type="submit">Find matching times</button><output class="receipt"></output></form>`],
sources:['Sources · optional','Will the API migration affect us?','Only the old export endpoint needs changing. Our authentication flow already uses the supported version.',`<details><summary><span class="favicon">D</span><span class="favicon">G</span> 3 sources · checked today</summary><div class="detail">API migration guide · official docs<br>Export client implementation · workspace<br>Deprecation schedule · official docs</div></details><p class="message">I can update that call and run the export checks before we switch over.</p>`],
files:['Upload · optional','Upload the reviewed report to our Acme folder.','I found the client folder. Here’s the destination and filename before uploading.',`<section class="panel"><div class="head"><strong>Upload report</strong><span class="muted">Google Drive · Work</span></div><div class="path">Shared drive · Clients<div>Acme<div>Reports</div></div></div><label class="field">Filename<input value="Acme assessment — final.docx" aria-label="Upload filename"></label><p class="meta">246 KB · New file · No existing file will be replaced</p><div class="actions"><button class="primary" data-result="Demo: reviews this exact file, name and destination">Approve upload</button><button data-result="Demo: opens destination chooser">Change folder</button></div><output class="receipt"></output></section>`],
monitor:['Monitoring · optional','Are you still watching the shared inbox?','Yes. Nothing new needs your attention since Jordan’s reply this morning.',`<div class="monitor"><span class="dot"></span><strong>Acme inbox</strong><span class="muted">Last checked 2 min ago</span><button data-result="Demo: opens this monitor’s settings">Manage</button></div><output class="receipt"></output><p class="meta">Shown when asked—not posted after every check.</p>`]
};
const nav=document.querySelector('#nav'),chat=document.querySelector('#chat');function show(key){const c=cases[key];chat.innerHTML=`<div class="user">${c[1]}</div><div class="person">${av('Paul')}Paul</div><p class="message">${c[2]}</p>${c[3]}`;document.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.case===key)));history.replaceState(null,'','#'+key)}for(const[key,c]of Object.entries(cases)){const b=document.createElement('button');b.textContent=c[0];b.dataset.case=key;b.onclick=()=>show(key);nav.append(b)}const theme=document.createElement('button');theme.textContent='Light / dark';theme.onclick=()=>document.body.classList.toggle('light');nav.append(theme);
chat.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('slot')){chat.querySelectorAll('.slot').forEach(s=>s.setAttribute('aria-pressed',String(s===b)));return}if(b.hasAttribute('data-feedback')){const label=document.createElement('label');label.className='field';label.textContent='Requested changes';const t=document.createElement('textarea');t.placeholder='What should change?';label.append(t);b.closest('.panel').insertBefore(label,b.parentElement);b.disabled=true;t.focus();return}if(b.dataset.result)chat.querySelector('output').textContent=b.dataset.result};chat.onsubmit=e=>{e.preventDefault();chat.querySelector('output').textContent='Demo: sends these answers together to the bot.'};show(cases[location.hash.slice(1)]?location.hash.slice(1):'project');
</script></html>
