<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindred update</title>
<style>
@import url("./progress.css");
@font-face{font-family:Inter;src:url('./fonts/InterVariable.woff2') format('woff2');font-weight:100 900}:root{color-scheme:dark;font:14px Inter,system-ui,sans-serif;background:#0d0d0d;color:#ededed}*{box-sizing:border-box}body{margin:0;padding:26px 28px}header{display:flex;align-items:center;gap:16px;margin-bottom:20px}h1{font-size:20px;font-weight:600;margin:0}p{color:#ababaa;font-size:13px;line-height:1.5;min-height:39px;margin:0 0 20px}.bot{position:relative;width:40px;height:35px;border-radius:50% 48% 43% 44%;background:#dedfdc;animation:roll 1.8s ease-in-out infinite}.bot:before,.bot:after{content:'';position:absolute;top:12px;width:3px;height:8px;border-radius:3px;background:#252626;transform:rotate(-12deg)}.bot:before{left:14px}.bot:after{left:24px}progress{width:100%;height:7px;accent-color:var(--progress-accent)}footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px}small{color:#909493}button{font:inherit;border:1px solid #424645;border-radius:8px;padding:8px 15px;background:#222;color:inherit;cursor:pointer}button:hover{background:#303030}.done .bot{animation:none}.error progress{accent-color:var(--progress-accent)}@keyframes roll{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(16deg) translateY(-3px)}}@media(prefers-reduced-motion:reduce){.bot{animation:none}}
progress{border:0;border-radius:99px;overflow:hidden;background:#303030}progress::-webkit-progress-bar{background:#303030}progress::-webkit-progress-value{background:var(--progress-accent);transition:width .3s ease}button:focus-visible{outline:2px solid #69a6f9;outline-offset:3px}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){progress::-webkit-progress-value{transition:none}}</style>
<header><span class="bot" aria-hidden="true"></span><h1 id="title">Checking for updates</h1></header><p id="message" role="status" aria-live="polite">Checking Kindred releases…</p><progress id="progress" max="100"></progress><footer><small id="version">Stable channel</small><button id="restart" hidden>Restart Kindred</button><button id="close">Cancel</button></footer>
<script>
const invoke=window.__TAURI__.core.invoke;let polling=true;
const titles={checking:'Checking for updates',downloading:'Downloading update',verifying:'Verifying download',installing:'Installing client',ready:'Ready to restart',restarting:'Ready to restart',current:"You're up to date",error:'Update could not finish',cancelled:'Update cancelled',complete:'Updated'};
function render(s){document.getElementById('title').textContent=titles[s.status]||'Updating Kindred';document.getElementById('message').textContent=s.message||'';const p=document.getElementById('progress');if(['downloading','verifying','installing','ready','restarting','current','complete'].includes(s.status))p.value=['ready','restarting','current','complete'].includes(s.status)?p.max:Math.max(0,Math.min(p.max,s.progress||0));else p.removeAttribute('value');const done=['error','cancelled','current','complete','ready'].includes(s.status);document.body.classList.toggle('done',done);document.body.classList.toggle('error',s.status==='error');document.getElementById('close').textContent=done||s.status==='installing'?'Close':'Cancel';document.getElementById('restart').hidden=s.status!=='ready';if(s.version)document.getElementById('version').textContent='Kindred '+s.version+' · Stable';if(done)polling=false;}
document.getElementById('restart').onclick=async()=>{const b=document.getElementById('restart');b.disabled=true;try{await invoke('restart_update')}catch(e){document.getElementById('message').textContent=String(e);b.disabled=false;}};
document.getElementById('close').onclick=()=>invoke('close_update');
(async()=>{try{await invoke('begin_update');while(polling){try{render(await invoke('update_status'))}catch{}await new Promise(r=>setTimeout(r,150));}}catch(e){render({status:'error',message:String(e)})}})();
</script></html>
