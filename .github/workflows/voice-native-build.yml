name: Native voice compile check (manual only)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact reviewed source. Compiles app, widget, and native voice tests without booting a simulator.'
        required: true
        type: string
      approve_runner_usage:
        description: 'Approve one unsigned Apple SDK compile check, maximum 10 minutes. No automatic retries.'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  compile:
    if: ${{ inputs.approve_runner_usage }}
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify source and select installed Apple SDK
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          expected=os.environ['EXPECTED_SOURCE']
          assert re.fullmatch(r'[0-9a-f]{40}',expected)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected
          out=Path('voice-native-check');out.mkdir()
          choices=[]
          for path in Path('/Applications').glob('Xcode*.app/Contents/Developer'):
              try:
                  sdk=subprocess.check_output(['xcrun','--sdk','iphonesimulator','--show-sdk-version'],env=dict(os.environ,DEVELOPER_DIR=str(path)),text=True,stderr=subprocess.DEVNULL,timeout=15).strip()
                  choices.append((tuple(map(int,sdk.split('.'))),str(path)))
              except (OSError,ValueError,subprocess.SubprocessError): pass
          version,developer=max(choices,default=((0,),''))
          assert version >= (27,1), 'Installed iOS 27.1 SDK required; no downloads or automatic retry'
          with open(os.environ['GITHUB_ENV'],'a') as file: file.write('DEVELOPER_DIR='+developer+'\n')
          files=['mobile/ios/KindredCompanion/Voice/NativeVoiceCall.swift','mobile/ios/KindredCompanionTests/NativeVoiceCallTests.swift','ui/voice.js','ui/voice-audio-worklet.js','ui/style.css']
          (out/'source.json').write_text(json.dumps({'source_commit':expected,'developer_directory':developer,'sdk':'.'.join(map(str,version)),'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},'runtime_tests_executed':False,'signed':False},indent=2)+'\n')
          PY
      - name: Generate project and compile native audio tests
        run: |
          command -v xcodegen || brew install xcodegen
          (cd mobile/ios && xcodegen generate)
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          out=Path('voice-native-check').resolve()
          command=['xcodebuild','-project','mobile/ios/KindredCompanion.xcodeproj','-scheme','KindredCompanion','-configuration','Debug','-destination','generic/platform=iOS Simulator','-derivedDataPath',str(out/'DerivedData'),'-only-testing:KindredCompanionTests/NativeVoiceCallTests','CODE_SIGNING_ALLOWED=NO','CODE_SIGNING_REQUIRED=NO','build-for-testing']
          result={'command':command,'runtime_tests_executed':False,'signed':False}
          with (out/'build.log').open('w') as log:
              try:
                  completed=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=420)
                  result['exit_code']=completed.returncode
              except subprocess.TimeoutExpired:
                  result['timed_out']=True;result['exit_code']=124
          result['passed']=result['exit_code']==0
          (out/'verification.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          raise SystemExit(result['exit_code'])
          PY
      - name: Preserve compile evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-voice-compile-${{ inputs.source_commit }}
          path: |
            voice-native-check/*.json
            voice-native-check/build.log
          retention-days: 14
