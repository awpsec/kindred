name: Mac standalone resource refresh (manual only)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact already verified application source commit.
        required: true
        type: string
      version:
        description: Approved unpublished release version.
        required: true
        type: string
      input_release:
        description: Private repack-inputs draft containing inputs.zip.
        required: true
        type: string
      approve_runner_usage:
        description: Approve one resource refresh and native validation, capped at 12 minutes.
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: kindred-resource-refresh
  cancel-in-progress: false
jobs:
  package:
    if: ${{ inputs.approve_runner_usage }}
    runs-on: macos-15
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      INPUT_RELEASE: ${{ inputs.input_release }}
      RELEASE_VERSION: ${{ inputs.version }}
      BUILD_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch verified packaging inputs without rebuilding the app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$INPUT_RELEASE" =~ ^repack-inputs-[0-9A-Za-z.-]+$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          test "$(gh release view "$INPUT_RELEASE" --json isDraft --jq .isDraft)" = true
          gh release download "$INPUT_RELEASE" --dir repack-input --pattern inputs.zip
          python3 - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          root=Path('repack-input')
          with zipfile.ZipFile(root/'inputs.zip') as archive:
              names=archive.namelist()
              assert len(set(names))==len(names)
              assert all(Path(n).name==n and '\\' not in n and n not in ('','..','.') for n in names)
              archive.extractall(root)
          manifest=json.loads((root/'input-hashes.json').read_text())
          assert set(names)==set(manifest)|{'input-hashes.json'}
          for name,digest in manifest.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          source=json.loads(Path('desktop/tauri.conf.json').read_text())
          assert source['version']==os.environ['RELEASE_VERSION']
          shutil.copyfile(root/'standalone.zip','desktop/standalone.zip')
          PY
      - name: Refresh Mac resource, reseal and test the real app
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/repack-standalone.py --input repack-input --output package-output --target aarch64-apple-darwin
          python3 scripts/release/test-macos-package.py --directory package-output --source . --version "$RELEASE_VERSION" --source-commit "$BUILD_COMMIT" --target aarch64-apple-darwin --output mac-validation --reuse-native-validation repack-input/macos-validation.json
      - name: Preserve packages and validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-refresh-macos-15
          path: |
            package-output/*
            mac-validation/**
          if-no-files-found: warn
          retention-days: 14
