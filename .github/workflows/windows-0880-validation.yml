name: Verify retained 0.88.0 Windows build
on:
  workflow_dispatch:
    inputs:
      approve_runner_usage:
        description: 'Validate the retained exact Windows binary; no application rebuild.'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: kindred-windows-0880-validation
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ inputs.approve_runner_usage && github.run_attempt == '1' }}
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      KINDRED_PACKAGE_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13aaeb9cc6d3beb20abf30aab82cd72cc6fa05f5
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: .verification-tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: kindred-native-v1-x86_64-pc-windows-msvc-${{ hashFiles('desktop/Cargo.lock', 'desktop/build.rs', 'desktop/dictation/**') }}
          restore-keys: kindred-native-v1-x86_64-pc-windows-msvc-
          fail-on-cache-miss: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '41014437926'
          name: unverified-kindred-0.88.0-x86_64-pc-windows-msvc
          path: retained
      - name: Bind retained executable and standalone bundle to the original build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download build-inputs-0.88.0-13aaeb9 --repo awpsec/kindred --pattern standalone.zip --dir desktop
          python - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          source='13aaeb9cc6d3beb20abf30aab82cd72cc6fa05f5'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert subprocess.check_output(['git','-C','.verification-tools','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          assert json.loads(Path('desktop/tauri.conf.json').read_text())['version']=='0.88.0'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          binary=Path('retained/desktop/target/x86_64-pc-windows-msvc/release/kindred-desktop.exe')
          expected='09db50f59399646aa288536c116bf6fbbf59f96ef39d18dfa93220d93492f5ef'
          assert sha(binary)==expected
          assert sha(Path('desktop/standalone.zip'))=='f84d08ba6dd7e109d1af03c54d79bb311a6558b2e62e94243641f3a520f34dd8'
          dest=Path('desktop/target/x86_64-pc-windows-msvc/release/kindred-desktop.exe')
          dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(binary,dest)
          assert sha(dest)==expected
          out=Path('verification-proof');out.mkdir()
          (out/'retained-build.json').write_text(json.dumps({'version':'0.88.0','source_commit':source,'build_run':41014437926,'artifact_id':12959501195,'binary_sha256':expected,'application_rebuilt':False},indent=2))
          PY
      - name: Verify unchanged cold native discovery and explicit Compose replacement
        id: network
        run: python scripts/release/test-native-network.py --target x86_64-pc-windows-msvc --output native-network-validation
      - name: Diagnose a repeated discovery failure without changing its result
        if: ${{ failure() && steps.network.outcome == 'failure' }}
        run: |
          helper=.verification-tools/scripts/release/test-windows-network-phases.py
          helper_sha=$(python -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$helper")
          python "$helper" --source-commit 13aaeb9cc6d3beb20abf30aab82cd72cc6fa05f5 --expected-helper-sha256 "$helper_sha" --output phase-proof
      - name: Verify actual retained executable command lifetime and cancellation
        run: python scripts/release/test-command-worker.py --binary desktop/target/x86_64-pc-windows-msvc/release/kindred-desktop.exe > verification-proof/worker.json
      - name: Verify embedded native disclosure, Library and computer popout
        run: node .verification-tools/scripts/release/native-ui-smoke/run-native.cjs --source . --binary desktop/target/x86_64-pc-windows-msvc/release/kindred-desktop.exe --output native-ui-validation --version 0.88.0 --source-commit 13aaeb9cc6d3beb20abf30aab82cd72cc6fa05f5
      - name: Collect only the verified unchanged executable
        run: python scripts/release/collect-packages.py --target x86_64-pc-windows-msvc --output package-artifacts
      - name: Preserve all native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-validation-0.88.0
          path: |
            verification-proof/
            native-network-validation/
            native-ui-validation/
            phase-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain packages only after every gate passes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kindred-0.88.0-x86_64-pc-windows-msvc
          path: package-artifacts/*
          if-no-files-found: error
          retention-days: 14
