name: Retained native verification (manual only)
on:
  workflow_dispatch:
    inputs:
      approve_runner_usage:
        required: true
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options: [windows, macos]
permissions:
  contents: read
  actions: read
concurrency:
  group: kindred-08710-verification-only-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ inputs.approve_runner_usage }}
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2025' || 'macos-26' }}
    timeout-minutes: 10
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"target":"x86_64-pc-windows-msvc"}]' || '[{"target":"aarch64-apple-darwin"}]') }}
    env:
      KINDRED_PACKAGE_SOURCE_ROOT: ${{ github.workspace }}
      RELEASE_VERSION: '0.87.10'
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '146373f5e255b62c60b34701d730a6ced0dffbdf'
          persist-credentials: false
      - name: Check out exact verification tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: ${{ matrix.target }}
      - name: Restore isolated test-helper dependencies only
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: kindred-native-v1-${{ matrix.target }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/build.rs', 'desktop/dictation/**') }}
          restore-keys: kindred-native-v1-${{ matrix.target }}-
      - name: Remove stale product outputs before exact restore
        shell: bash
        run: python -c "from pathlib import Path; import shutil; p=Path('desktop/target/${{ matrix.target }}/release'); shutil.rmtree(p/'bundle',ignore_errors=True); [(p/n).unlink(missing_ok=True) for n in ['kindred-desktop','kindred-desktop.exe']]"
      - name: Restore qualified immutable native package (no product build or signing)
        shell: bash
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .release-tools/scripts/release/native-ui-smoke/reuse-native.py restore --platform '${{ inputs.platform }}'
      - name: Reuse selected Mac Paste browser cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/kindred-paste-browsers
          key: kindred-paste-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.release-tools/scripts/release/mac-paste-smoke/package-lock.json') }}
      - name: Install selected disposable Mac Paste dependencies
        if: runner.os == 'macOS'
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/kindred-paste-browsers
        run: |
          mkdir -p mac-validation
          python - <<'PYPASTE'
          from pathlib import Path
          import subprocess, time, json
          root = Path('.release-tools/scripts/release/mac-paste-smoke').resolve()
          receipts = []
          try:
              for name, args, limit in [('npm-ci', ['npm', 'ci', '--offline', '--ignore-scripts', '--no-audit', '--no-fund'], 120), ('require-cached-chromium', ['node', '-e', "const fs=require('node:fs');const p=require('playwright').chromium.executablePath();if(!fs.existsSync(p))throw Error('Reviewed cached Chromium missing; no download selected');"], 15)]:
                  started = time.monotonic()
                  entry = {'stage': name, 'command': args, 'timeout_seconds': limit}
                  try:
                      with (Path('mac-validation') / (name + '.log')).open('w') as log:
                          result = subprocess.run(args, cwd=root, stdout=log, stderr=subprocess.STDOUT, timeout=limit, check=True)
                      entry['exit'] = result.returncode
                  except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as error:
                      entry.update(error=type(error).__name__, exit=getattr(error, 'returncode', None))
                      raise
                  finally:
                      entry['elapsed_seconds'] = time.monotonic()-started
                      receipts.append(entry)
          finally:
              Path('mac-validation/paste-dependency-setup.json').write_text(json.dumps(receipts, indent=2))
          PYPASTE
      - name: Verify actual native interface discovery and explicit Compose replacement
        id: native_network
        shell: bash
        run: python .release-tools/scripts/release/native-ui-smoke/test-native-network.py --target ${{ matrix.target }} --output native-network-validation
      - name: Diagnose Windows discovery only after the original timeout failure
        if: ${{ failure() && runner.os == 'Windows' && steps.native_network.outcome == 'failure' }}
        shell: bash
        timeout-minutes: 1
        run: python .release-tools/scripts/release/native-ui-smoke/windows-discovery-diagnostic.py --failed-receipt native-network-validation/network-validation.json --output native-network-validation/post-failure-timing.json
      - name: Preserve native network evidence including gaps
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-network-0.87.10-${{ matrix.target }}
          path: native-network-validation/
          if-no-files-found: warn
      - name: Verify native background command lifetime and cancellation
        shell: bash
        run: |
          worker_binary="desktop/target/${{ matrix.target }}/release/kindred-desktop"
          if [ "${{ runner.os }}" = "Windows" ]; then worker_binary="$worker_binary.exe"; fi
          python .release-tools/scripts/release/test-command-worker.py --binary "$worker_binary"
      - name: Verify and collect this platform
        run: python .release-tools/scripts/release/collect-packages.py --target ${{ matrix.target }} --output package-artifacts
      - name: Bind honest original-build and current-verification provenance
        shell: bash
        run: python .release-tools/scripts/release/native-ui-smoke/reuse-native.py provenance --platform '${{ inputs.platform }}'
      - name: Verify actual embedded native popout disclosure and focus
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        env:
          APP_SOURCE: 146373f5e255b62c60b34701d730a6ced0dffbdf
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            native_binary="desktop/target/x86_64-pc-windows-msvc/release/kindred-desktop.exe"
          else
            native_binary="desktop/target/aarch64-apple-darwin/release/bundle/macos/Kindred.app/Contents/MacOS/kindred-desktop"
          fi
          node .release-tools/scripts/release/native-ui-smoke/run-native.cjs --source . --source-commit "$APP_SOURCE" --version "$RELEASE_VERSION" --binary "$native_binary" --output native-ui-validation
          python .release-tools/scripts/release/native-ui-smoke/join-native-package.py --target "${{ matrix.target }}" --source-commit "$APP_SOURCE" --version "$RELEASE_VERSION"
      - name: Preserve actual embedded native verification including gaps
        if: ${{ always() && (runner.os == 'Windows' || runner.os == 'macOS') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ui-0.87.10-${{ matrix.target }}
          path: native-ui-validation/
          if-no-files-found: warn
          retention-days: 7
      - name: Launch and validate the packaged Mac app on its native architecture
        if: runner.os == 'macOS'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/kindred-paste-browsers
          KINDRED_TEST_MAC_PASTE_SELECTED: 1
        run: python .release-tools/scripts/release/test-macos-package.py --directory package-artifacts --source . --version "$RELEASE_VERSION" --source-commit "$(git rev-parse HEAD)" --target ${{ matrix.target }} --output mac-validation
      - name: Require original native package bytes unchanged after all checks
        shell: bash
        run: python .release-tools/scripts/release/native-ui-smoke/reuse-native.py unchanged --platform '${{ inputs.platform }}'
      - name: Upload packages only after all native gates pass
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kindred-0.87.10-${{ matrix.target }}
          path: package-artifacts/
          if-no-files-found: error
      - name: Preserve all verification evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-verification-only-0.87.10-${{ matrix.target }}
          path: |
            reuse-validation/
            native-ui-validation/
            native-network-validation/
            mac-validation/
          if-no-files-found: warn
