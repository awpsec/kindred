name: iOS simulator validation (manual only)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact reviewed desktop/iOS source commit.'
        required: true
        type: string
      validation_scope:
        description: 'Hosted UIKit tests or a voice-audio Apple SDK compile check without simulator boot.'
        required: true
        default: full
        type: choice
        options: [full, composer, release-ui, keyboard-ownership, voice-ui, identity-ui, voice-compile]
      approve_runner_usage:
        description: 'Approve this one unsigned simulator job, maximum 20 minutes; no automatic retry.'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: kindred-ios-simulator-manual
  cancel-in-progress: false
jobs:
  simulator:
    if: ${{ inputs.approve_runner_usage }}
    runs-on: xcode-27
    timeout-minutes: ${{ inputs.validation_scope == 'voice-compile' && 10 || 20 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify exact source and record Xcode identity
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          mkdir -p ios-validation
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          expected=os.environ['EXPECTED_SOURCE']
          assert re.fullmatch(r'[0-9a-f]{40}',expected)
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert actual==expected
          # The hosted image's default Xcode can lag its installed SDKs. Select
          # an existing toolchain; never download one or weaken the Duo gate.
          choices=[]
          for developer in Path('/Applications').glob('Xcode*.app/Contents/Developer'):
              env=dict(os.environ,DEVELOPER_DIR=str(developer))
              try:
                  sdk=subprocess.check_output(['xcrun','--sdk','iphonesimulator','--show-sdk-version'],env=env,text=True,stderr=subprocess.DEVNULL,timeout=20).strip()
                  version=tuple(map(int,sdk.split('.')))
                  choices.append((version,str(developer)))
              except (OSError,ValueError,subprocess.SubprocessError):
                  continue
          result={'source_commit':actual,'unsigned_simulator_only':True,'available_developer_directories':[{'sdk':'.'.join(map(str,version)),'path':path} for version,path in sorted(choices)]}
          version,developer=max(choices,default=((0,),''))
          Path('ios-validation/environment.json').write_text(json.dumps(result,indent=2)+'\n')
          assert version >= (27,1), 'An installed iOS 27.1+ SDK is required for the reserved-region bridge; no automatic retry.'
          os.environ['DEVELOPER_DIR']=developer
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('DEVELOPER_DIR='+developer+'\n')
          result.update(xcode=subprocess.check_output(['xcodebuild','-version'],text=True),developer_directory=developer,sdk_identity=subprocess.check_output(['xcodebuild','-showsdks'],text=True),selected_sdk='.'.join(map(str,version)))
          Path('ios-validation/environment.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Generate the existing iOS project
        shell: bash
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version > ios-validation/xcodegen-version.txt
          cd mobile/ios
          xcodegen generate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ inputs.validation_scope == 'composer' || inputs.validation_scope == 'release-ui' || inputs.validation_scope == 'keyboard-ownership' || inputs.validation_scope == 'voice-ui' || inputs.validation_scope == 'identity-ui' }}
        with:
          node-version: '22'
      - name: Run real UIKit app-hosted simulator tests once
        if: ${{ inputs.validation_scope != 'voice-compile' }}
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          VALIDATION_SCOPE: ${{ inputs.validation_scope }}
        run: |
          python3 scripts/release/test-ios-simulator.py --scope "$VALIDATION_SCOPE"
      - name: Compile app, widget, and native voice tests without simulator boot
        if: ${{ inputs.validation_scope == 'voice-compile' }}
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil,subprocess
          from pathlib import Path
          out=Path('ios-validation').resolve()
          files=['mobile/ios/KindredCompanion/Voice/NativeVoiceCall.swift','mobile/ios/KindredCompanionTests/NativeVoiceCallTests.swift','ui/voice.js','ui/voice-audio-worklet.js','ui/style.css']
          command=['xcodebuild','-project','mobile/ios/KindredCompanion.xcodeproj','-scheme','KindredCompanion','-configuration','Debug','-destination','generic/platform=iOS Simulator','-derivedDataPath',str(out/'DerivedData'),'-only-testing:KindredCompanionTests/NativeVoiceCallTests','CODE_SIGNING_ALLOWED=NO','CODE_SIGNING_REQUIRED=NO','build-for-testing']
          result={'command':command,'runtime_tests_executed':False,'signed':False,'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}}
          with (out/'voice-build.log').open('w') as log:
              try:
                  completed=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=420)
                  result['exit_code']=completed.returncode
              except subprocess.TimeoutExpired:
                  result['timed_out']=True;result['exit_code']=124
          result['passed']=result['exit_code']==0
          (out/'voice-compile.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          # Preserve compiler evidence; these products are not a signed app.
          shutil.rmtree(out/'DerivedData',ignore_errors=True)
          raise SystemExit(result['exit_code'])
          PY
      - name: Preserve exact results including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-simulator-validation-${{ inputs.source_commit }}
          path: ios-validation/
          if-no-files-found: warn
          retention-days: 14
