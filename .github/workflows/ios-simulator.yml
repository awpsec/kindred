name: iOS native regression (manual bounded child)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact accepted final desktop/iOS product commit
        required: true
        type: string
      pin_sha256:
        description: Final external release PIN SHA256 bound by selected Builder intent
        required: true
        type: string
      approve_runner_usage:
        description: Select ONE microphone-free unsigned simulator attempt, maximum20minutes
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: kindred-ios-simulator-manual
  cancel-in-progress: false
jobs:
  simulator:
    if: ${{ inputs.approve_runner_usage }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: tool
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          path: product
          persist-credentials: false
      - name: Run exact native capability guard and focused units once
        timeout-minutes: 17
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          EXTERNAL_PIN_SHA256: ${{ inputs.pin_sha256 }}
          EXPECTED_TOOL: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 tool/scripts/release/test-ios-native-regression.py --product product --tool tool --output native-validation
      - name: Preserve native receipts and unsigned simulator bundle including failures
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-native-regression-${{ inputs.source_commit }}
          path: |
            native-validation/*.json
            native-validation/*.stdout
            native-validation/*.stderr
            native-validation/*.xcresult
            native-validation/*.zip
          if-no-files-found: error
          retention-days: 14
