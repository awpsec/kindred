name: Retained Windows output verification (manual only)
on:
  workflow_dispatch:
    inputs:
      approve_runner_usage:
        description: 'Approve one retained-output native verification; no application rebuild.'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: kindred-windows-existing-output-verification-0.88.2
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: write
      actions: read
    if: ${{ inputs.approve_runner_usage && github.run_attempt == '1' }}
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      KINDRED_PACKAGE_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 310a3afc07e5d526654542bb10af00913a5319d8
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .verification-tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - name: Verify selected tool bytes and exact application source
        run: |
          python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == '310a3afc07e5d526654542bb10af00913a5319d8'
          tools = Path('.verification-tools')
          assert subprocess.check_output(['git', '-C', str(tools), 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          assert hashlib.sha256((tools / 'scripts/release/stage-retained-windows.py').read_bytes()).hexdigest() == '2de0ee13721f61c84a5fd1fb1b16009662947099928f80f6efcf79a73008a8af'
          PY
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: x86_64-pc-windows-msvc
      - name: Restore compiler dependencies without saving a cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: kindred-native-v1-x86_64-pc-windows-msvc-${{ hashFiles('desktop/Cargo.lock', 'desktop/build.rs', 'desktop/dictation/**') }}
          restore-keys: kindred-native-v1-x86_64-pc-windows-msvc-
          fail-on-cache-miss: true
      - name: Stage exact API-bound executable and adjacent standalone resource
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .verification-tools/scripts/release/stage-retained-windows.py --source . --output verification-proof
      - name: Verify unchanged cold production network discovery and Compose replacement
        id: network
        run: python scripts/release/test-native-network.py --target x86_64-pc-windows-msvc --output native-network-validation
      - name: Verify actual retained executable worker lifetime and cancellation
        id: worker
        run: python scripts/release/test-command-worker.py --binary desktop/target/x86_64-pc-windows-msvc/release/kindred-desktop.exe > verification-proof/worker.json
      - name: Verify embedded native disclosure, Library and computer popout
        id: native_ui
        run: node scripts/release/native-ui-smoke/run-native.cjs --source . --binary desktop/target/x86_64-pc-windows-msvc/release/kindred-desktop.exe --output native-ui-validation --version 0.88.2 --source-commit 310a3afc07e5d526654542bb10af00913a5319d8
      - name: Require unchanged inputs and every native receipt before collection
        id: gates
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          load = lambda path: json.loads(Path(path).read_text())
          sha = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          custody = load('verification-proof/retained-inputs.json')
          assert custody['staged'] is True and custody['adjacent_resource_bundle_verified'] is True
          assert custody['version'] == '0.88.2' and custody['server_source'] == '0483210f89455c9f7e33779901597b6c22fecf50'
          assert sha('desktop/target/x86_64-pc-windows-msvc/release/kindred-desktop.exe') == custody['exe_sha256'] == '3d855b91f59147d2a89c39ccf2d3a153599e5f0b7a76a8b1cdbc659859e3b840'
          assert sha('desktop/standalone.zip') == custody['bundle_sha256'] == '3362a8f85d8b49782270e031e942d50e13f8dfed69b09ec2d92377d4a90b05c9'
          network = load('native-network-validation/network-validation.json')
          assert network['passed'] is True and network['actual_native_discovery_passed'] is True and network['explicit_compose_generation_passed'] is True
          assert network['exit_code'] == 0
          assert network['source_commit'] == custody['source'] == '310a3afc07e5d526654542bb10af00913a5319d8'
          assert network['target'] == 'x86_64-pc-windows-msvc' and network['owner_state_mutated'] is False
          worker = load('verification-proof/worker.json')
          assert worker['platform'] == 'nt'
          assert all(worker[key] is True for key in ['passed', 'incremental_output', 'no_duplicate_execution', 'cancel', 'deadline', 'failed_exit', 'bounded_output'])
          ui = load('native-ui-validation/verification.json')
          assert ui['passed'] is True and ui['platform'] == 'windows' and ui['version'] == '0.88.2'
          assert ui['sourceCommit'] == custody['source'] and ui['binarySha256'] == custody['exe_sha256']
          evidence = ['verification-proof/retained-inputs.json', 'native-network-validation/network-validation.json', 'verification-proof/worker.json', 'native-ui-validation/verification.json']
          receipt = {'version': '0.88.2', 'source': custody['source'], 'server_source': custody['server_source'], 'native_gate_passed': True, 'application_rebuilt': False, 'evidence_sha256': {path: sha(path) for path in evidence}}
          with Path('verification-proof/native-gates.json').open('x') as output:
              output.write(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Verify and collect the retained native package
        id: collect
        run: python scripts/release/collect-packages.py --target x86_64-pc-windows-msvc --output package-artifacts
      - name: Retain native evidence including refusals
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-existing-evidence-${{ github.run_id }}-attempt1
          path: |
            verification-proof/*.json
            native-network-validation/
            native-ui-validation/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload packages only after every required native gate passed
        if: ${{ success() && steps.gates.outcome == 'success' && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kindred-0.88.2-x86_64-pc-windows-msvc
          path: package-artifacts/*
          if-no-files-found: error
          retention-days: 7
