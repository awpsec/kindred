name: Retained Windows output verification (manual only)
on:
  workflow_dispatch:
    inputs:
      approve_runner_usage:
        description: 'Approve one retained-output native verification; no application rebuild.'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: kindred-windows-existing-output-verification
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: write
      actions: read
    if: ${{ inputs.approve_runner_usage && github.run_attempt == '1' }}
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      KINDRED_PACKAGE_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 80bc079a11a90fbfa3077b6d26403fc2358238a2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .verification-tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify selected tool bytes and exact application source
        run: |
          python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == '80bc079a11a90fbfa3077b6d26403fc2358238a2'
          tools = Path('.verification-tools')
          assert subprocess.check_output(['git', '-C', str(tools), 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          assert hashlib.sha256((tools / 'scripts/release/stage-retained-windows.py').read_bytes()).hexdigest() == 'e59f05487aa93eb41eafc2c7228d26e554fcbcf6f4f328ec9e48ad41410d43a4'
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - name: Stage exact API-bound executable and adjacent standalone resource
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .verification-tools/scripts/release/stage-retained-windows.py --source . --output verification-proof
      - name: Verify and reuse original passing native network receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .verification-tools/scripts/release/reuse-0904-windows-network.py --output native-network-validation
      - name: Verify actual foreground reply, pane, disclosure, Library and computer gestures
        run: node .verification-tools/scripts/release/native-ui-smoke/run-native.cjs --source . --binary desktop/target/x86_64-pc-windows-msvc/release/kindred-desktop.exe --output native-ui-validation --version 0.90.4 --source-commit 80bc079a11a90fbfa3077b6d26403fc2358238a2
      - name: Preserve native UI evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ui-0.90.4-x86_64-pc-windows-msvc
          path: native-ui-validation/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve native network evidence and reuse provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-network-0.90.4-x86_64-pc-windows-msvc
          path: native-network-validation/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify actual retained executable worker lifetime and cancellation
        run: python scripts/release/test-command-worker.py --binary desktop/target/x86_64-pc-windows-msvc/release/kindred-desktop.exe > verification-proof/worker.json
      - name: Verify and collect the retained native package
        run: python scripts/release/collect-packages.py --target x86_64-pc-windows-msvc --output package-artifacts
      - name: Retain native evidence including refusals
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-existing-evidence-${{ github.run_id }}-attempt1
          path: |
            verification-proof/*.json
            native-network-validation/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload packages only after every required native gate passed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kindred-0.90.4-x86_64-pc-windows-msvc
          path: package-artifacts/*
          if-no-files-found: error
          retention-days: 7
